<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="nav">
        <div class="nav-logo">
            <img class="nav-image" src="./images/logoNetflix.svg" alt="Logo">
        </div>
        <div class="nav-links">
            <p class="nav-link">Inicio</p>
            <p class="nav-link">Series</p>
            <p class="nav-link">Peliculas</p>
            <p class="nav-link">Juegos</p>
        </div>
    </nav>

    <div class="card">
        <img class= "card-bg"src="./images/fondoCard.webp" />
        <div class="card-content">
            <div class="card-logo-container">
                <img class="card-logo" src="./images/logoCard.webp" />

            </div>
            <div>
                <h6 class="card-title">Anime - Accion - 2017 - 3 temporadas -16+</h6>
                <p class="card-description">Un joven con poderes sobrenaturales se une a un grupo de héroes para luchar contra villanos y
                    proteger a la humanidad.
                </p>
                <div class="card-buttons">
                    <p class="card-button primary">Reproducir</p>
                    <p class="card-button secondary">Mas info</p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
